services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karban
      POSTGRES_USER: karban
      POSTGRES_PASSWORD: karban_dev
    ports:
      - "5432:5432"
    volumes:
      - karban_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karban -d karban"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://karban:karban_dev@postgres:5432/karban?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-at-least-32-characters}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      PUBLIC_API_URLS: ${PUBLIC_API_URLS:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3001,tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      STORAGE_ROOT: /app/storage
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      RUN_SEED: "false"
    ports:
      - "4000:4000"
    volumes:
      - ./backend/storage:/app/storage
    command: sh -c "npm run prisma:deploy && npm run dev"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.local
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "5174:5174"

  website:
    build:
      context: ./website
      dockerfile: Dockerfile.local
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3001:3001"

volumes:
  karban_pg:
